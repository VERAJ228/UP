<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
</head>
<body>
    <h1>Edit Product</h1>
    <form method="POST" enctype="multipart/form-data">
        <label for="name">Product Name:</label>
        <input type="text" name="name" value="{{ product.name }}" required><br>

        <label for="brand">Brand:</label>
        <input type="text" name="brand" value="{{ product.brand }}"><br>

        <label for="category">Category:</label>
        <input type="text" name="category" value="{{ product.category }}"><br>

        <label for="price">Price:</label>
        <input type="number" name="price" value="{{ product.price }}" required><br>

        <label for="purchase_price">Purchase Price:</label>
        <input type="number" name="purchase_price" value="{{ product.purchase_price }}" required><br>

        <label for="stock_quantity">Stock Quantity:</label>
        <input type="number" name="stock_quantity" value="{{ product.stock_quantity }}" required><br>

        <label for="image">Image:</label>
        <input type="file" name="image"><br>

        <input type="submit" value="Update Product">
    </form>
    <a href="{{ url_for('index') }}">Back to Products</a>
</body>
</html>
